name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      # Public, synthetic fixtures only; browser tests intercept the provider/API.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api/v1
      NEXT_PUBLIC_SUPABASE_URL: https://rhc-e2e.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit runtime dependencies
        run: npm run audit:runtime
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: API tests
        run: npm run test -w @rhc/api -- --runInBand
        env:
          NODE_ENV: test
      - name: API end-to-end tests
        run: npm run test:e2e -w @rhc/api -- --runInBand
        env:
          NODE_ENV: test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Customer browser tests
        run: npm run test:e2e -w @rhc/customer-web
      - name: Admin browser tests
        run: npm run test:e2e -w @rhc/admin-web
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            apps/customer-web/test-results/
            apps/admin-web/test-results/
          if-no-files-found: ignore
          retention-days: 7
